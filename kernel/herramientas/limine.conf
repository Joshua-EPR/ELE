# Menú de Limine. Con timeout 3 se puede elegir con las flechas; sin tocar
# nada arranca la primera entrada. construir.ps1 -Prueba genera una copia con
# timeout 0 (sin menú) para no esperar; -Imagen conserva el menú.
timeout: 3
serial: yes

/ELE kernel
    protocol: limine
    path: boot():/boot/kernel.elf

/ELE kernel (ENCA desde cero: medir entrenamiento)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: enca=nuevo

/ELE kernel (exp010: reproducir mejoras de ENCA)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: enca=exp010

/ELE kernel (ENCA: prueba de aprendizaje)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: enca=prueba21

/ELE kernel (ENCA: barrido de ranuras)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: enca=ranuras

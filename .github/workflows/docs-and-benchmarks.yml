name: Documentation & Benchmark Validation

on:
  push:
    branches: [main, docs/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs-and-benchmarks:
    name: Validate Docs, Benchmarks & SVG Charts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate Benchmark JSON Results & Integrity
        run: python benchmarks/scripts/validate_results.py

      - name: Verify Deterministic SVG Chart Generation
        run: |
          python benchmarks/scripts/generate_charts.py
          git diff --exit-code assets/benchmarks/

      - name: Verify Documentation Links and Assets
        run: python benchmarks/scripts/validate_doc_links.py

      - name: Check Formatting & Clippy Quality Gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify Canonical ELE v2 Syntax Ratchet
        run: cargo test -p project-l --test ele_v2_legacy_ratchet -- --test-threads=1

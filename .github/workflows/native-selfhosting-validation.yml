name: ELE native self-hosting validation

on:
  push:
    branches: [main, feat/ele-original-syntax-v2]
  pull_request:
    branches: [main, feat/ele-8.7.4.5-native-interop-ci, feat/ele-v2-generic-of-syntax, feat/ele-v2-stage1-of-types]
  workflow_dispatch:

concurrency:
  group: native-interop-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-and-native-lir:
    name: Stage 0 / Stage 1 / native ELF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify original ELE surface syntax in Stage 0
        run: cargo test -p project-l --test ele_syntax_v2 -- --test-threads=1
      - name: Verify ELE of[T] generic grammar and semantic checks
        run: cargo test -p project-l --test ele_generics_v2 -- --test-threads=1
      - name: Execute ELE generic of[T] through both native backends
        if: runner.os == 'Windows'
        run: cargo test -p project-l --test generics_traits test_ele_v2_generic_of_executes_on_both_backends -- --test-threads=1
      - name: Verify syntax and bootstrap regression cases
        run: cargo test -p project-l --test ele_syntax_regressions -- --test-threads=1
      - name: Verify platform-independent ELE-LIR protocol
        run: cargo test -p project-l --test lir_payload_protocol -- --test-threads=1
      # Stage 0's Cranelift builder currently targets only Windows x86-64.
      # Keep these real Stage 1 / native ELF build tests on MSVC instead of
      # treating unsupported Linux host compilation as a backend regression.
      - name: Build Stage 1 and native ELE backend with Stage 0 (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l
          --test native_enum_stage1_l
          --test ele_stage1_generic_types
          --test native_enum_stage1_payload_l
          --test native_heap_l
          --test native_heap_dynamic_l
          --test native_enum_l
          --test native_cfg_l
          --test native_struct_cfg_l
          --test native_nested_struct_l
          -- --test-threads=1
      # On Linux, Stage 1 is built through Stage 0's reference backend (see
      # tests/stage1_support). The ELE-written backend then compiles real .l
      # sources to ELF64 and the tests execute those images on this runner.
      - name: Build Stage 1 with Stage 0 and execute ELE-built ELF64 (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: >-
          cargo test -p project-l
          --test native_print_l
          --test native_refs_l
          --test native_aggregates_l
          --test native_enum_stage1_l
          --test ele_stage1_generic_types
          --test native_enum_stage1_payload_l
          --test native_heap_l
          --test native_heap_dynamic_l
          --test native_enum_l
          --test native_enum_payload_l
          --test native_cfg_l
          --test native_struct_cfg_l
          --test native_nested_struct_l
          --test native_layout_l
          --test native_memory_l
          --test native_stack_layout_l
          -- --test-threads=1
      # Suites restored by fixing Stage 0 diagnostics, the token limit and the
      # compiler stack. They build with Cranelift, which targets Windows only.
      - name: Stage 0 front end, modules, references and differential suites (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l
          --test cfg
          --test conformance
          --test differential
          --test modules
          --test references
          --test regions
          --test borrow_l
          -- --test-threads=1
      - name: Native print, references and Text queries through the ELE backend (MSVC host, image checks)
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test -p project-l --test native_print_l --test native_refs_l --test native_aggregates_l -- --test-threads=1
      # Compile actual .l source and the wrong-active LIR using the ELE-written
      # backend on Windows, then execute their Linux ELF64 output on Linux.
      # Stage 0 itself is currently MSVC-only; no Linux Stage 0 is assumed.
      - name: Export ELE-built ELF64 for Linux execution
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ele-native-elf64-fixtures
          path: |
            target/stage1-tests/native-enum-payload-stage1/payload.elf
            target/stage1-tests/native-enum-wrong-active/wrong-active.elf
            target/stage1-tests/ele-syntax-v2/syntax.elf
            target/stage1-tests/ele-nested-nominal/nested-match.elf
            target/stage1-tests/native-cfg-loop/loop.elf
            target/stage1-tests/native-struct-source/struct.elf
            target/stage1-tests/native-nested-struct/nested.elf
            target/stage1-tests/native-heap/heap-ok.elf
            target/stage1-tests/native-heap/heap-bad.elf
            target/stage1-tests/native-heap-advanced/*.elf
            target/stage1-tests/native-refs/*.elf
            target/stage1-tests/native-aggregates/*.elf
          if-no-files-found: error
          retention-days: 3
      - name: Run native backend contract tests
        if: runner.os == 'Linux' && always()
        run: python3 -m unittest discover -s tests/native_backend -p 'test_*.py' -q
      - name: Check Rust diagnostics
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        if: always()
        run: cargo fmt --all --check

  execute-native-elf-on-linux:
    name: Execute Windows-built ELE ELF64 on Linux x86-64
    needs: rust-and-native-lir
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ELF64 binaries generated by ELE
        uses: actions/download-artifact@v4
        with:
          name: ele-native-elf64-fixtures
          path: target/interop-elf64
      - name: Check ELF64 binaries and execute expected outcomes
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          directory = pathlib.Path("target/interop-elf64")
          # 42: real source .l -> Stage 1 LIR -> ELE-native backend -> ELF64.
          # 126: invalid active variant must trap before extracting its payload.
          for name, expected in [
              ("payload.elf", 42),
              ("syntax.elf", 42),
              ("nested-match.elf", 42),
              ("wrong-active.elf", 126),
              ("loop.elf", 8),
              ("struct.elf", 42),
              ("nested.elf", 42),
              ("heap-ok.elf", 42),
              ("heap-bad.elf", 124),
              ("dynamic-t.elf", 42),
              ("dynamic-z.elf", 122),
              ("dynamic-n.elf", 122),
              ("dynamic-h.elf", 122),
              ("dynamic-u.elf", 124),
              ("owner-o.elf", 42),
              ("owner-d.elf", 121),
              ("owner-m.elf", 121),
              ("owner-r.elf", 120),
              ("owner-b.elf", 121),
              ("resize-g.elf", 42),
              ("resize-s.elf", 42),
              ("resize-t.elf", 42),
              ("resize-z.elf", 122),
              ("resize-h.elf", 122),
              ("resize-m.elf", 121),
              ("list-p.elf", 42),
              ("list-g.elf", 42),
              ("list-t.elf", 42),
              ("list-o.elf", 127),
              ("list-e.elf", 127),
              ("list-d.elf", 121),
              ("list-b.elf", 121),
              ("list-c.elf", 127),
              ("list-k.elf", 127),
              ("list-q.elf", 127),
              # view/edit references, Text queries and checked arithmetic.
              ("native_refs_stage1.elf", 0),
              ("native_text_query_stage1.elf", 0),
              ("native_arith_stage1.elf", 0),
              ("store_ok.elf", 7),
              ("div_zero.elf", 125),
              ("rem_zero.elf", 125),
              ("div_min.elf", 125),
              ("rem_min.elf", 125),
              ("neg_min.elf", 125),
              ("index_len.elf", 127),
              ("index_negative.elf", 127),
              ("index_last.elf", 0),
              # shape/choice by value and partial moves.
              ("native_shape_abi_stage1.elf", 0),
              ("native_shape_moves_stage1.elf", 0),
              ("partial_move_ok.elf", 135),
          ]:
              matches = list(directory.rglob(name))
              assert len(matches) == 1, f"{name}: expected exactly one artifact, got {matches}"
              binary = matches[0]
              payload = binary.read_bytes()
              assert len(payload) > 4096, f"{name}: ELF64 image too short"
              assert payload.startswith(bytes([0x7f, 0x45, 0x4c, 0x46, 2, 1, 1])), f"{name}: not ELF64 little-endian"
              binary.chmod(binary.stat().st_mode | 0o111)
              result = subprocess.run([str(binary.resolve())], timeout=15, check=False)
              assert result.returncode == expected, (
                  f"{name}: expected Linux exit {expected}, got {result.returncode}"
              )
              print(f"{name}: native Linux exit {expected} verified")
          PY

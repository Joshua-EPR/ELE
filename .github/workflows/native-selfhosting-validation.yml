name: ELE native self-hosting validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-interop-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-and-native-lir:
    name: Stage 0 / Stage 1 / native ELF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify platform-independent ELE-LIR protocol
        run: cargo test -p project-l --test lir_payload_protocol -- --test-threads=1
      # Stage 0's Cranelift builder currently targets only Windows x86-64.
      # Keep these real Stage 1 / native ELF build tests on MSVC instead of
      # treating unsupported Linux host compilation as a backend regression.
      - name: Build Stage 1 and native ELE backend with Stage 0 (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l
          --test native_enum_stage1_l
          --test native_enum_stage1_payload_l
          --test native_enum_l
          -- --test-threads=1
      - name: Run native backend contract tests
        if: runner.os == 'Linux' && always()
        run: python3 -m unittest discover -s tests/native_backend -p 'test_*.py' -q
      - name: Check Rust diagnostics
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        if: always()
        run: cargo fmt --all --check

  rustfmt-one-time-repair:
    # This job is deliberately restricted to the branch owned by this PR.
    # Remove it once the formatting commit has been verified.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/ele-8.7.4.5-native-interop-ci' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Commit formatting separately
        shell: bash
        run: |
          if ! git diff --quiet -- crates/l; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/l
            git commit -m "style(rust): apply cargo fmt to existing sources and tests"
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          else
            echo "No formatting changes required."
          fi

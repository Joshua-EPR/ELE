name: ELE native self-hosting validation

on:
  push:
    branches: [main]
  pull_request:
    # Stacked feature PRs target other feature branches. Run this gate for
    # every PR head instead of silently omitting those integration changes.
  workflow_dispatch:

concurrency:
  group: native-interop-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-and-native-lir:
    name: Stage 0 / Stage 1 / native ELF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify original ELE surface syntax in Stage 0
        run: cargo test -p project-l --test ele_syntax_v2 -- --test-threads=1
      - name: Forbid regressions to the legacy (pre-v2) ELE spelling
        run: cargo test -p project-l --test ele_v2_legacy_ratchet -- --test-threads=1
      - name: Verificar todos los ejemplos con sintaxis ELE v2
        run: cargo test -p project-l --test examples_ele_v2 -- --test-threads=1
      - name: Verify ELE of[T] generic grammar and semantic checks
        run: cargo test -p project-l --test ele_generics_v2 -- --test-threads=1
      - name: Execute ELE generic of[T] through both native backends
        if: runner.os == 'Windows'
        run: cargo test -p project-l --test generics_traits test_ele_v2_generic_of_executes_on_both_backends -- --test-threads=1
      - name: Verify syntax and bootstrap regression cases
        run: cargo test -p project-l --test ele_syntax_regressions -- --test-threads=1
      - name: Verify platform-independent ELE-LIR protocol
        run: cargo test -p project-l --test lir_payload_protocol -- --test-threads=1
      # Stage 0's Cranelift builder currently targets only Windows x86-64.
      # Keep these real Stage 1 / native ELF build tests on MSVC instead of
      # treating unsupported Linux host compilation as a backend regression.
      - name: Build Stage 1 and native ELE backend with Stage 0 (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l
          --test native_enum_stage1_l
          --test ele_stage1_generic_types
          --test native_builtin_union_l
          --test native_enum_stage1_payload_l
          --test native_heap_l
          --test native_heap_dynamic_l
          --test native_enum_l
          --test native_cfg_l
          --test native_struct_cfg_l
          --test native_nested_struct_l
          --test native_list_l
          -- --test-threads=1
      # On Linux, Stage 1 is built through Stage 0's reference backend (see
      # tests/stage1_support). The ELE-written backend then compiles real .l
      # sources to ELF64 and the tests execute those images on this runner.
      - name: Build Stage 1 with Stage 0 and execute ELE-built ELF64 (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: >-
          cargo test -p project-l
          --test native_print_l
          --test native_refs_l
          --test native_aggregates_l
          --test native_text_fields_l
          --test native_wide_struct_l
          --test native_enum_stage1_l
          --test ele_stage1_generic_types
          --test native_builtin_union_l
          --test native_enum_stage1_payload_l
          --test native_heap_l
          --test native_heap_dynamic_l
          --test native_enum_l
          --test native_enum_payload_l
          --test native_cfg_l
          --test native_struct_cfg_l
          --test native_nested_struct_l
          --test native_layout_l
          --test native_memory_l
          --test native_stack_layout_l
          --test native_list_l
          --test native_pe64_l
          -- --test-threads=1
      # Stage 1 is already built by the Linux step above. Explicitly exercise
      # the autonomous driver with external std roots and fail-closed imports
      # here; the full Windows suite runs these tests automatically.
      - name: ELEPad standard library search root regression tests (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: |
          cargo test -p project-l --test ele_build_driver_l driver_library_ -- --test-threads=1
          cargo test -p project-l --test ele_build_driver_l driver_resolves_elepad_std_console_with_explicit_library_root -- --test-threads=1
      # P0-B file streams: the ELF64 image runs natively here (Windows runs
      # the PE32+ half inside the full suite below).
      - name: Native file streams (Linux ELF64)
        if: runner.os == 'Linux' && !cancelled()
        run: cargo test -p project-l --test file_streams_l -- --test-threads=1
      # Suites restored by fixing Stage 0 diagnostics, the token limit and the
      # compiler stack. They build with Cranelift, which targets Windows only.
      - name: Stage 0 front end, modules, references and differential suites (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l
          --test cfg
          --test conformance
          --test differential
          --test modules
          --test references
          --test regions
          --test borrow_l
          -- --test-threads=1
      # Historical Stage 1 module integration and cursor equivalence tests.
      # Run them in CI so these self-hosting blockers cannot remain invisible.
      - name: Stage 1 module imports and token cursor regressions (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l --no-fail-fast
          --test modules_l --test self_hosting -- --test-threads=1
      # The focused suites above detect module/cursor regressions early.
      # Run ALL Windows tests as well; a green subset is not a green compiler.
      - name: Suite completa Windows/MSVC (Stage 0 y Stage 1)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l --no-fail-fast -- --test-threads=1
      # std/io/console.l through the autonomous driver: decoder over
      # redirected bytes, then a real console (AllocConsole +
      # WriteConsoleInputW) read with ReadConsoleInputW, and the console
      # input mode restored afterwards.
      - name: Console input library (Windows, real console)
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          cargo build -p project-l --bin l
          New-Item -ItemType Directory -Force target/ele-driver | Out-Null
          Push-Location target/ele-driver
          ../debug/l.exe build ../../compiler-l/src/main_driver.l --backend cranelift
          Pop-Location
          $driver = (Get-ChildItem target/ele-driver/target/cranelift -Recurse -Filter main_driver.exe | Select-Object -First 1).FullName
          ./tests/std/console_input.ps1 -Ele $driver
      - name: Win64 callback through autonomous PE generator
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $driver = (Get-ChildItem target/ele-driver/target/cranelift -Recurse -Filter main_driver.exe | Select-Object -First 1).FullName
          ./tests/native_backend/win64_callback.ps1 -Ele $driver
      - name: Win32 window and message loop through autonomous PE generator
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $driver = (Get-ChildItem target/ele-driver/target/cranelift -Recurse -Filter main_driver.exe | Select-Object -First 1).FullName
          ./tests/native_backend/win64_window.ps1 -Ele $driver
      # Stage 1 tools were bootstrapped by the Rust integration suites above.
      # This is a per-entry + imported closure measurement, not Stage 2.
      - name: Test self-coverage gate (MSVC)
        if: runner.os == 'Windows' && !cancelled()
        run: python -m unittest discover -s tests/native_backend -p 'test_self_coverage_gate.py' -v
      - name: Measure Stage 1 self-coverage and reject green-phase regressions (MSVC)
        if: runner.os == 'Windows' && success()
        run: >-
          python tools/self_coverage_gate.py
          --baseline docs/SELF_COVERAGE_MATRIX_2026-11-11.md
      - name: Preserve Stage 1 self-coverage evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-self-coverage-${{ github.run_id }}-${{ matrix.os }}
          path: |
            target/stage1-tests/self-coverage-gate/report.json
            target/stage1-tests/self-coverage-gate/report.md
          if-no-files-found: warn
          retention-days: 7
      - name: Native print, references and Text queries through the ELE backend (MSVC host, image checks)
        if: runner.os == 'Windows' && !cancelled()
        run: >-
          cargo test -p project-l --test native_print_l --test native_refs_l
          --test native_aggregates_l --test native_text_fields_l
          --test native_wide_struct_l --test native_pe64_l -- --test-threads=1
      # Compile actual .l source and the wrong-active LIR using the ELE-written
      # backend on Windows, then execute their Linux ELF64 output on Linux.
      # Stage 0 itself is currently MSVC-only; no Linux Stage 0 is assumed.
      - name: Export ELE-built ELF64 for Linux execution
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ele-native-elf64-fixtures
          path: |
            target/stage1-tests/native-enum-payload-stage1/payload.elf
            target/stage1-tests/native-enum-wrong-active/wrong-active.elf
            target/stage1-tests/ele-syntax-v2/syntax.elf
            target/stage1-tests/ele-nested-nominal/nested-match.elf
            target/stage1-tests/native-cfg-loop/loop.elf
            target/stage1-tests/native-struct-source/struct.elf
            target/stage1-tests/native-nested-struct/nested.elf
            target/stage1-tests/native-heap/heap-ok.elf
            target/stage1-tests/native-heap/heap-bad.elf
            target/stage1-tests/native-heap-advanced/*.elf
            target/stage1-tests/native-refs/*.elf
            target/stage1-tests/native-aggregates/*.elf
            target/stage1-tests/native-text-fields/*.elf
            target/stage1-tests/native-wide-struct/*.elf
            target/stage1-tests/native-list/*.elf
            examples/native_list_int_stage1.expected
            examples/native_list_owned_stage1.expected
            examples/native_loans_stage1.expected
            examples/native_list_replace_stage1.expected
          if-no-files-found: error
          retention-days: 3
      - name: Comprobar mmap/munmap de Text en shape amplio (Linux)
        if: runner.os == 'Linux' && success()
        shell: bash
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi
          image=target/stage1-tests/native-wide-struct/native_wide_6_text_stage1.elf
          chmod +x "$image"
          strace -qq -e trace=mmap,mremap,munmap -o "$RUNNER_TEMP/wide-text.strace" "$image" > "$RUNNER_TEMP/wide-text.out"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "wide-text.strace"
          lines = path.read_text().splitlines()
          maps = [line for line in lines if line.startswith("mmap(") and " = -1" not in line]
          unmaps = [line for line in lines if line.startswith("munmap(") and line.rstrip().endswith("= 0")]
          remaps = [line for line in lines if line.startswith("mremap(")]
          print(f"Text propietario: mmap={len(maps)}, mremap={len(remaps)}, munmap={len(unmaps)}")
          assert len(maps) >= 2, "no se observaron reservas de los dos Text propios"
          assert len(maps) == len(unmaps), "el ejemplo no libera todas sus reservas"
          PY
      - name: Comprobar reservas y liberaciones de listas nativas (Linux)
        if: runner.os == 'Linux' && success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          for name in (
              "native_list_int_stage1",
              "native_list_owned_stage1",
              "native_loans_stage1",
              "native_list_replace_stage1",
          ):
              image = Path("target/stage1-tests/native-list") / f"{name}.elf"
              trace = Path("target/stage1-tests/native-list") / f"{name}.strace"
              image.chmod(image.stat().st_mode | 0o111)
              run = subprocess.run(
                  ["strace", "-qq", "-e", "trace=mmap,mremap,munmap",
                   "-o", str(trace), str(image.resolve())],
                  capture_output=True, timeout=60, check=False,
              )
              expected = (Path("examples") / f"{name}.expected").read_bytes()
              assert run.returncode == 0, f"{name}: exit {run.returncode}: {run.stderr!r}"
              assert run.stdout == expected, f"{name}: stdout differs from Stage 0"
              lines = trace.read_text().splitlines()
              maps = [s for s in lines if s.startswith("mmap(") and " = -1" not in s]
              unmaps = [s for s in lines if s.startswith("munmap(") and s.rstrip().endswith("= 0")]
              remaps = [s for s in lines if s.startswith("mremap(")]
              assert maps and len(maps) == len(unmaps), f"{name}: mmap={len(maps)}, munmap={len(unmaps)}"
              print(f"{name}: mmap={len(maps)}, mremap={len(remaps)}, munmap={len(unmaps)}")
          PY
      - name: Run native backend contract tests
        if: runner.os == 'Linux' && always()
        run: |
          python3 -m unittest discover -s tests/native_backend -p 'test_*.py' -q
          python3 tools/test_native_enum_contract.py
      # Install/verify strace earlier in this Linux job. The B11 hook will
      # fail if Stage 1 or its ELE-native backend launches any child process,
      # including a Rust frontend by absolute path.
      - name: B11 isolated Stage 1 -> native ELF with execve guard (Linux)
        if: runner.os == 'Linux' && !cancelled()
        env:
          ELE_REQUIRE_STRACE: "1"
        run: cargo test -p project-l --test stage2_hook_l -- --test-threads=1
      - name: Check Rust diagnostics
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        if: always()
        run: cargo fmt --all --check

  execute-native-elf-on-linux:
    name: Execute Windows-built ELE ELF64 on Linux x86-64
    needs: rust-and-native-lir
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ELF64 binaries generated by ELE
        uses: actions/download-artifact@v4
        with:
          name: ele-native-elf64-fixtures
          path: target/interop-elf64
      - name: Check ELF64 binaries and execute expected outcomes
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          directory = pathlib.Path("target/interop-elf64")
          # 42: real source .l -> Stage 1 LIR -> ELE-native backend -> ELF64.
          # 126: invalid active variant must trap before extracting its payload.
          for name, expected in [
              ("payload.elf", 42),
              ("syntax.elf", 42),
              ("nested-match.elf", 42),
              ("wrong-active.elf", 126),
              ("loop.elf", 8),
              ("struct.elf", 42),
              ("nested.elf", 42),
              ("heap-ok.elf", 42),
              ("heap-bad.elf", 124),
              ("dynamic-t.elf", 42),
              ("dynamic-z.elf", 122),
              ("dynamic-n.elf", 122),
              ("dynamic-h.elf", 122),
              ("dynamic-u.elf", 124),
              ("owner-o.elf", 42),
              ("owner-d.elf", 121),
              ("owner-m.elf", 121),
              ("owner-r.elf", 120),
              ("owner-b.elf", 121),
              ("resize-g.elf", 42),
              ("resize-s.elf", 42),
              ("resize-t.elf", 42),
              ("resize-z.elf", 122),
              ("resize-h.elf", 122),
              ("resize-m.elf", 121),
              ("list-p.elf", 42),
              ("list-g.elf", 42),
              ("list-t.elf", 42),
              ("list-o.elf", 127),
              ("list-e.elf", 127),
              ("list-d.elf", 121),
              ("list-b.elf", 121),
              ("list-c.elf", 127),
              ("list-k.elf", 127),
              ("list-q.elf", 127),
              ("native_list_int_stage1.elf", 0),
              ("native_list_owned_stage1.elf", 0),
              ("native_loans_stage1.elf", 0),
              ("native_list_replace_stage1.elf", 0),
              ("native_cfg_list_index_ok.elf", 2),
              ("native_cfg_list_elem_ref_ok.elf", 42),
              ("native_cfg_loan_ok.elf", 42),
              ("native_cfg_loan_disjoint_fields.elf", 42),
              ("native_cfg_list_index_oob.elf", 127),
              ("native_cfg_list_index_negative.elf", 127),
              ("native_cfg_list_reserve_negative.elf", 123),
              ("native_cfg_list_elem_store_owned.elf", 0),
              # view/edit references, Text queries and checked arithmetic.
              ("native_refs_stage1.elf", 0),
              ("native_text_query_stage1.elf", 0),
              ("native_arith_stage1.elf", 0),
              ("store_ok.elf", 7),
              ("local_ref.elf", 1),
              ("div_zero.elf", 125),
              ("rem_zero.elf", 125),
              ("div_min.elf", 125),
              ("rem_min.elf", 125),
              ("neg_min.elf", 125),
              ("index_len.elf", 127),
              ("index_negative.elf", 127),
              ("index_last.elf", 0),
              # shape/choice by value and partial moves.
              ("native_shape_abi_stage1.elf", 0),
              ("native_shape_moves_stage1.elf", 0),
              ("partial_move_ok.elf", 135),
              # Text fields of shapes.
              ("native_text_fields_stage1.elf", 0),
              ("native_text_fields_heap_stage1.elf", 0),
              ("native_text_fields_flags_stage1.elf", 0),
              ("tfield_replace_ok.elf", 2),
              # Constructors with 6, 17 and 64 fields.
              ("native_wide_17_stage1.elf", 0),
              ("native_wide_6_text_stage1.elf", 0),
              ("native_cfg_wide_64.elf", 42),
          ]:
              matches = list(directory.rglob(name))
              assert len(matches) == 1, f"{name}: expected exactly one artifact, got {matches}"
              binary = matches[0]
              payload = binary.read_bytes()
              assert len(payload) > 4096, f"{name}: ELF64 image too short"
              assert payload.startswith(bytes([0x7f, 0x45, 0x4c, 0x46, 2, 1, 1])), f"{name}: not ELF64 little-endian"
              binary.chmod(binary.stat().st_mode | 0o111)
              result = subprocess.run([str(binary.resolve())], timeout=15, check=False, capture_output=True)
              assert result.returncode == expected, (
                  f"{name}: expected Linux exit {expected}, got {result.returncode}"
              )
              if name in {
                  "native_list_int_stage1.elf",
                  "native_list_owned_stage1.elf",
                  "native_loans_stage1.elf",
                  "native_list_replace_stage1.elf",
              }:
                  expected_output = next(directory.rglob(name.removesuffix(".elf") + ".expected")).read_bytes().replace(b"\r\n", b"\n")
                  assert result.stdout == expected_output, f"{name}: stdout differs from Stage 0"
                  assert not result.stderr, f"{name}: unexpected stderr"
              print(f"{name}: native Linux exit {expected} verified")
          PY


  differential-native-cfg-v2:
    name: Differential CFG native (base vs ELE v2, ELF64)
    # This is a SEMANTICS-PRESERVING syntax-migration test, not a gate for
    # feature PRs that intentionally change compiler output or fixtures.
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'chore/ele-v2-native-backend-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build one shared Stage 0 bootstrap executable
        run: cargo build -p project-l --bin l
      - name: Build main and PR CFG backends; compare every LIR fixture, diagnostics and ELF64
        env:
          ELE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/verify_native_cfg_migration.py --base "$ELE_BASE_SHA"
      - name: Preserve differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cfg-differential-report
          path: target/differential/native-cfg-results.json
          if-no-files-found: warn
          retention-days: 7

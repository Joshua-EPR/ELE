name: Independent seed bootstrap

# Both bootstrap jobs start from versioned, SHA-256-pinned seeds. They never
# build or download a Stage 0 compiler and rebuild the driver with ELE only
# (seed -> Gen1' -> Gen2 -> Gen3, Gen2 == Gen3). Seed provenance and pins live
# beside the seed archives in scripts/bootstrap/seeds/manifest.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: stage0-free-bootstrap-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-linux:
    name: bootstrap ELF64 without Rust (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit active Stage 0 dependencies
        run: python3 tools/audit_stage0_paths.py --enforce
      - name: Verify and extract the pinned ELF64 seed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/bootstrap -p 'test_*.py' -v
          python3 tools/verify_seed_archive.py elf --output "${{ runner.temp }}/seed/ele-seed-elf"
      - name: Scrub cargo/rustc/rustup from PATH
        shell: bash
        run: |
          set -euo pipefail
          clean=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -i -e '\.cargo' -e 'rustup' -e '/rust' | paste -sd: -)
          echo "PATH=$clean" >> "$GITHUB_ENV"
          echo "CARGO_HOME=" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=" >> "$GITHUB_ENV"
      - name: Assert no Rust toolchain is resolvable
        shell: bash
        run: |
          set -u
          echo "PATH=$PATH"
          bad=0
          for t in cargo rustc rustup; do
            if p=$(command -v "$t"); then echo "::error::$t still resolvable at $p"; bad=1; else echo "$t: not resolvable"; fi
          done
          exit $bad
      - name: Restrict PATH to runtime utilities, no compiler backends
        shell: bash
        run: |
          set -euo pipefail
          clean_path="${RUNNER_TEMP}/ele-bootstrap-path"
          mkdir -p "$clean_path"
          # The runner still starts bash by absolute path. These symlinks are
          # the only commands the bootstrap and corpus scripts need on PATH.
          # In particular, do not expose gcc/clang/cc/ld/lld or MSVC tools.
          for tool in sh bash timeout sha256sum shasum cut sed tr mkdir wc chmod grep head od cmp find sort rm mktemp cat awk sleep kill tee pwd date basename dirname cp mv env touch readlink realpath xargs tail git python3; do
            resolved=$(command -v "$tool")
            test -n "$resolved"
            ln -sf "$resolved" "$clean_path/$tool"
          done
          for tool in cargo rustc rustup l cl link gcc clang ld lld ld.lld cc; do
            if PATH="$clean_path" command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool remains available on the bootstrap PATH"
              exit 1
            fi
          done
          echo "PATH=$clean_path" >> "$GITHUB_ENV"
      - name: Stage-0-free bootstrap (seed -> Gen1' -> Gen2 -> Gen3)
        shell: bash
        env:
          ELE_BOOTSTRAP_FORBID_TOOLCHAIN: "1"
          ELE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          seed="${{ runner.temp }}/seed/ele-seed-elf"
          sha=$(python3 -c 'import json; print(json.load(open("scripts/bootstrap/seeds/manifest.json", encoding="utf-8"))["targets"]["elf"]["seed_sha256"])')
          sh scripts/bootstrap/ele_seed_bootstrap.sh --seed "$seed" --seed-sha256 "$sha" \
            --target elf --out-dir "${{ runner.temp }}/bootstrap-elf" --forbid-toolchain-on-path
      - name: Native conformance corpus with Gen3 (no Rust on PATH)
        shell: bash
        run: sh tests/native_corpus/run.sh "${{ runner.temp }}/bootstrap-elf/gen3.elf"
      - name: Gen3 self-coverage gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/self_coverage_gate.py \
            --gen3 "${{ runner.temp }}/bootstrap-elf/gen3.elf" --gen3-target elf \
            --baseline docs/SELF_COVERAGE_MATRIX_2026-11-11.md \
            --output "${{ runner.temp }}/bootstrap-elf/self-coverage" --timeout 180
      - name: Upload provenance and Gen3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-free-bootstrap-elf
          path: |
            ${{ runner.temp }}/bootstrap-elf/provenance.json
            ${{ runner.temp }}/bootstrap-elf/SHA256SUMS
            ${{ runner.temp }}/bootstrap-elf/gen3.elf
            ${{ runner.temp }}/bootstrap-elf/logs/
            ${{ runner.temp }}/bootstrap-elf/self-coverage/report.json
            ${{ runner.temp }}/bootstrap-elf/self-coverage/report.md
          if-no-files-found: warn
          retention-days: 14

  bootstrap-windows:
    name: bootstrap PE32+ without Rust (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit active Stage 0 dependencies
        run: python tools/audit_stage0_paths.py --enforce
      - name: Verify and extract the pinned PE32+ seed
        shell: pwsh
        run: |
          python -m unittest discover -s tests/bootstrap -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_seed_archive.py pe --output (Join-Path '${{ runner.temp }}' 'seed/ele-seed-pe.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scrub cargo/rustc/rustup from PATH
        shell: pwsh
        run: |
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '\\\.cargo|rustup|\\Rust\b' }) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_HOME=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Assert no Rust toolchain is resolvable
        shell: pwsh
        run: |
          Write-Host "PATH=$env:PATH"
          $bad = $false
          foreach ($t in 'cargo', 'rustc', 'rustup') {
            $c = Get-Command $t -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($c) { Write-Host "::error::$t still resolvable at $($c.Source)"; $bad = $true } else { Write-Host "${t}: not resolvable" }
          }
          if ($bad) { exit 1 }
      - name: Restrict PATH to Windows runtime utilities, no compiler backends
        shell: pwsh
        run: |
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          $python = Get-Command python -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $python) { throw 'Python from setup-python was not found before PATH isolation' }
          $allowed = @($PSHOME, (Join-Path $env:SystemRoot 'System32'), (Split-Path -Parent $python.Source))
          if ($git) { $allowed += (Split-Path -Parent $git.Source) }
          $cleanPath = $allowed -join ';'
          $env:PATH = $cleanPath
          $bad = $false
          foreach ($t in 'cargo', 'rustc', 'rustup', 'l', 'cl', 'link', 'gcc', 'clang', 'ld', 'lld', 'cc') {
            $c = Get-Command $t -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($c) { Write-Host "::error::$t remains available at $($c.Source)"; $bad = $true }
          }
          if ($bad) { exit 1 }
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stage-0-free bootstrap (seed -> Gen1' -> Gen2 -> Gen3)
        shell: pwsh
        env:
          ELE_BOOTSTRAP_FORBID_TOOLCHAIN: "1"
          ELE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $seed = Join-Path '${{ runner.temp }}' 'seed/ele-seed-pe.exe'
          $manifest = Get-Content -Raw 'scripts/bootstrap/seeds/manifest.json' | ConvertFrom-Json
          $sha = $manifest.targets.pe.seed_sha256
          ./scripts/bootstrap/ele_seed_bootstrap.ps1 -Seed $seed -SeedSha256 $sha -Target pe `
            -OutDir (Join-Path '${{ runner.temp }}' 'bootstrap-pe') -ForbidToolchainOnPath
          exit $LASTEXITCODE
      - name: Native conformance corpus with Gen3 (no Rust on PATH)
        shell: pwsh
        run: |
          ./tests/native_corpus/run.ps1 (Join-Path '${{ runner.temp }}' 'bootstrap-pe/gen3.exe')
          exit $LASTEXITCODE
      - name: Gen3 self-coverage gate
        shell: pwsh
        run: |
          python tools/self_coverage_gate.py `
            --gen3 (Join-Path '${{ runner.temp }}' 'bootstrap-pe/gen3.exe') --gen3-target pe `
            --baseline docs/SELF_COVERAGE_MATRIX_2026-11-11.md `
            --output (Join-Path '${{ runner.temp }}' 'bootstrap-pe/self-coverage') --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload provenance and Gen3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-free-bootstrap-pe
          path: |
            ${{ runner.temp }}/bootstrap-pe/provenance.json
            ${{ runner.temp }}/bootstrap-pe/SHA256SUMS
            ${{ runner.temp }}/bootstrap-pe/gen3.exe
            ${{ runner.temp }}/bootstrap-pe/logs/
            ${{ runner.temp }}/bootstrap-pe/self-coverage/report.json
            ${{ runner.temp }}/bootstrap-pe/self-coverage/report.md
          if-no-files-found: warn
          retention-days: 14

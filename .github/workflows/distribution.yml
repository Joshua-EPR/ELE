name: Distribution & Packaging CI

on:
  push:
    branches: [main]
  pull_request:
    # Package the exact head of every stacked PR.
  workflow_dispatch:

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-and-verify:
    name: Package & Verify Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit active Stage 0 dependencies
        run: python tools/audit_stage0_paths.py --enforce

      - name: Verify and extract native seed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/verify_seed_archive.py pe --output (Join-Path '${{ runner.temp }}' 'seed/ele-seed-pe.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and extract native seed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_seed_archive.py elf --output "${{ runner.temp }}/seed/ele-seed-elf"
          chmod 755 "${{ runner.temp }}/seed/ele-seed-elf"

      - name: Restrict PATH to packaging utilities, no compiler backends (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          $allowed = @($PSHOME, (Join-Path $env:SystemRoot 'System32'), (Split-Path -Parent $python.Source))
          if ($git) { $allowed += (Split-Path -Parent $git.Source) }
          $cleanPath = $allowed -join ';'
          $env:PATH = $cleanPath
          $bad = $false
          foreach ($t in 'cargo', 'rustc', 'rustup', 'l', 'cl', 'link', 'gcc', 'clang', 'ld', 'lld', 'cc') {
            $c = Get-Command $t -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($c) { Write-Host "::error::$t remains available at $($c.Source)"; $bad = $true }
          }
          if ($bad) { exit 1 }
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restrict PATH to packaging utilities, no compiler backends (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          clean_path="${RUNNER_TEMP}/ele-distribution-path"
          mkdir -p "$clean_path"
          for tool in sh bash timeout sha256sum shasum cut sed tr mkdir wc chmod grep head od cmp find sort rm mktemp cat awk sleep kill tee pwd date basename dirname cp mv env touch readlink realpath xargs tail git tar gzip uname python3; do
            resolved=$(command -v "$tool")
            test -n "$resolved"
            ln -sf "$resolved" "$clean_path/$tool"
          done
          for tool in cargo rustc rustup l cl link gcc clang ld lld ld.lld cc; do
            if PATH="$clean_path" command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool remains available on the distribution PATH"
              exit 1
            fi
          done
          echo "PATH=$clean_path" >> "$GITHUB_ENV"

      - name: Test fail-closed Gen 2 / Gen 3 packaging contract
        run: python -m unittest discover -s tests -p test_package_distribution_fixpoint.py -v

      - name: Build Distribution Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $seed = Join-Path '${{ runner.temp }}' 'seed/ele-seed-pe.exe'
          python scripts/package_distribution.py --target windows --driver-path $seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Distribution Packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/package_distribution.py --target linux --driver-path "${{ runner.temp }}/seed/ele-seed-elf"

      - name: Test Native Installer & Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\ele-installed" -NoPathUpdate

      - name: Test Native Installer & Verify (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/install.sh --prefix "$RUNNER_TEMP/ele-installed" --no-path

      - name: Smoke Test Installed Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $ele = "$env:RUNNER_TEMP\ele-installed\bin\ele.exe"
          & $ele --version
          & $ele --help
          & $ele build examples/hello.l --output "$env:RUNNER_TEMP\hello.exe"
          $out = & "$env:RUNNER_TEMP\hello.exe"
          if ($out.Trim() -ne "42") { throw "Unexpected output: $out" }

      - name: Smoke Test Installed Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ele="$RUNNER_TEMP/ele-installed/bin/ele"
          "$ele" --version
          "$ele" --help
          "$ele" build examples/hello.l --target elf --output "$RUNNER_TEMP/hello"
          chmod 755 "$RUNNER_TEMP/hello"
          out=$("$RUNNER_TEMP/hello")
          if [ "$out" != "42" ]; then echo "Unexpected output: $out"; exit 1; fi

      - name: Verify SHA256 Checksum Manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt
          $manifest = Get-Content dist/SHA256SUMS.txt
          foreach ($line in $manifest) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split '\s+'
              $expectedHash = $parts[0]
              $filename = $parts[1]
              $actualHash = (Get-FileHash -Algorithm SHA256 "dist/$filename").Hash.ToLower()
              if ($actualHash -ne $expectedHash.ToLower()) {
                  throw "Checksum mismatch for ${filename}: expected $expectedHash, got $actualHash"
              }
              Write-Host "Verified checksum for ${filename}: OK"
          }

      - name: Verify SHA256 Checksum Manifest (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ele-dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

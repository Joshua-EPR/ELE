<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">

    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1f2328; }
      .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #656d76; }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #1f2328; }
      .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #656d76; }
      .text-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 600; fill: #1f2328; }
      .grid { stroke: #e1e4e8; stroke-dasharray: 3 3; }
      .axis { stroke: #d0d7de; stroke-width: 1.5; }
      .border { stroke: #d0d7de; stroke-width: 1; fill: none; }
      .bar-ele { fill: #0969da; }
      .bar-rust { fill: #d9381e; }
      .bar-gcc { fill: #1a7f37; }
      .bar-neutral { fill: #8250df; }
      .badge-bg { fill: #dafbe1; stroke: #aceebb; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #1a7f37; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .text-title { fill: #f0f6fc; }
        .text-subtitle { fill: #8b949e; }
        .text-label { fill: #e6edf3; }
        .text-muted { fill: #8b949e; }
        .text-val { fill: #f0f6fc; }
        .grid { stroke: #21262d; }
        .axis { stroke: #30363d; }
        .border { stroke: #30363d; }
        .bar-ele { fill: #2f81f7; }
        .bar-rust { fill: #f85149; }
        .bar-gcc { fill: #3fb950; }
        .bar-neutral { fill: #a371f7; }
        .badge-bg { fill: #1f3524; stroke: #2ea043; }
        .badge-text { fill: #3fb950; }
      }
    </style>

<rect width="760" height="420" rx="8" class="bg border"/>
<text x="30" y="38" class="text-title">Compiler Peak Memory Usage (RSS)</text>
<text x="30" y="58" class="text-subtitle">Measured via Windows Job Object Kernel PeakWorkingSetSize · MiB · Lower is better</text>
<line x1="200.0" y1="75" x2="200.0" y2="379" class="grid"/>
<text x="200.0" y="397" text-anchor="middle" class="text-muted">0 MiB</text>
<line x1="315.0" y1="75" x2="315.0" y2="379" class="grid"/>
<text x="315.0" y="397" text-anchor="middle" class="text-muted">250 MiB</text>
<line x1="430.0" y1="75" x2="430.0" y2="379" class="grid"/>
<text x="430.0" y="397" text-anchor="middle" class="text-muted">500 MiB</text>
<line x1="545.0" y1="75" x2="545.0" y2="379" class="grid"/>
<text x="545.0" y="397" text-anchor="middle" class="text-muted">750 MiB</text>
<line x1="660.0" y1="75" x2="660.0" y2="379" class="grid"/>
<text x="660.0" y="397" text-anchor="middle" class="text-muted">1000 MiB</text>
<line x1="200" y1="75" x2="200" y2="379" class="axis"/>
<text x="185" y="103" text-anchor="end" class="text-label">hello.l</text>
<rect x="200" y="85" width="0.5" height="26" rx="4" class="bar-ele"/>
<text x="210.5" y="103" class="text-val">1.18 MiB</text>
<text x="185" y="145" text-anchor="end" class="text-label">arithmetic.l</text>
<rect x="200" y="127" width="0.6" height="26" rx="4" class="bar-ele"/>
<text x="210.6" y="145" class="text-val">1.21 MiB</text>
<text x="185" y="187" text-anchor="end" class="text-label">fibonacci.l</text>
<rect x="200" y="169" width="0.6" height="26" rx="4" class="bar-ele"/>
<text x="210.6" y="187" class="text-val">1.21 MiB</text>
<text x="185" y="229" text-anchor="end" class="text-label">text_processing.l</text>
<rect x="200" y="211" width="0.6" height="26" rx="4" class="bar-ele"/>
<text x="210.6" y="229" class="text-val">1.20 MiB</text>
<text x="185" y="271" text-anchor="end" class="text-label">multimodule</text>
<rect x="200" y="253" width="0.6" height="26" rx="4" class="bar-ele"/>
<text x="210.6" y="271" class="text-val">1.22 MiB</text>
<text x="185" y="313" text-anchor="end" class="text-label">main_sema.l (45k LIR)</text>
<rect x="200" y="295" width="24.1" height="26" rx="4" class="bar-ele"/>
<text x="234.1" y="313" class="text-val">52.46 MiB</text>
<text x="185" y="355" text-anchor="end" class="text-label">main_driver.l (72k LIR)</text>
<rect x="200" y="337" width="40.3" height="26" rx="4" class="bar-ele"/>
<text x="250.3" y="355" class="text-val">87.53 MiB</text>
<text x="30" y="405" class="text-muted">Standard programs compile in ~24.5 MiB. Monolithic self-hosting compilation peaks at 855 MiB (72,000+ LIR lines).</text>
</svg>